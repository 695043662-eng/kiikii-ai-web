<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rose Curve - Pink Dark</title>
  <style>
    :root { --primary: #e84393; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0; width: 100%; height: 100%;
      display: grid; place-items: center;
      background: transparent !important; color: #e84393;
      font-family: Inter, system-ui, sans-serif; overflow: hidden;
    }
    .loader { display: grid; gap: 12px; justify-items: center; padding: 16px; width: 100%; }
    .frame { width: min(80%, 320px); aspect-ratio: 1; display: grid; place-items: center; position: relative; }
    .frame::before {
      content: ''; position: absolute; inset: -20%;
      background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
      opacity: 0.25; filter: blur(25px); pointer-events: none;
    }
    svg { width: 100%; height: 100%; overflow: visible; position: relative; z-index: 1; }
    .info { display: grid; gap: 4px; text-align: center; position: relative; z-index: 1; }
    .title { font-size: 18px; font-weight: 700; color: #fff; }
    .tag { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.35); }
    .progress-bar { width: min(80%, 200px); height: 2px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; position: relative; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 999px; width: 0%; transition: width 0.3s ease; }
    .percent { font-size: 10px; color: rgba(255,255,255,0.3); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="frame">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <g id="group"><path id="path" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"></path></g>
      </svg>
    </div>
    <div class="info"><div class="title">Loading</div><div class="tag">Rose Curve Animation</div></div>
    <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    <div class="percent" id="pctText">0%</div>
  </div>
  <script>
    var NS='http://www.w3.org/2000/svg',color='#e84393';var cfg={particleCount:64,trailSpan:0.28,durationMs:12000,rotationDurationMs:20000,pulseDurationMs:3200,strokeWidth:3.5,roseA:9.2,roseABoost:0.6,roseBreathBase:0.72,roseBreathBoost:0.28,roseK:5,roseScale:3.0};function rosePoint(p,d){var t=p*Math.PI*2,a=cfg.roseA+d*cfg.roseABoost,r=a*(cfg.roseBreathBase+d*cfg.roseBreathBoost)*Math.cos(Math.round(cfg.roseK)*t);return{x:50+Math.cos(t)*r*cfg.roseScale,y:50+Math.sin(t)*r*cfg.roseScale}}function norm(p){return((p%1)+1)%1}function ds(t){var p=(t%cfg.pulseDurationMs)/cfg.pulseDurationMs;return 0.55+((Math.sin(p*Math.PI*2+0.55)+1)/2)*0.45}function rot(t){return-((t%cfg.rotationDurationMs)/cfg.rotationDurationMs)*360}function bp(d,s){var pts=[];for(var i=0;i<=s;i++){var pt=rosePoint(i/s,d);pts.push((i===0?'M':'L')+' '+pt.x.toFixed(2)+' '+pt.y.toFixed(2))}return pts.join(' ')}var g=document.getElementById('group'),pa=document.getElementById('path'),pf=document.getElementById('progFill'),pc=document.getElementById('pctText');pa.setAttribute('stroke',color);var ps=[];for(var i=0;i<cfg.particleCount;i++){var c=document.createElementNS(NS,'circle');c.setAttribute('fill',color);g.appendChild(c);ps.push(c)}var st=performance.now();function an(){var t=performance.now()-st,p=(t%cfg.durationMs)/cfg.durationMs,d=ds(t);g.setAttribute('transform','rotate('+rot(t)+' 50 50)');pa.setAttribute('d',bp(d,360));for(var i=0;i<cfg.particleCount;i++){var to=i/(cfg.particleCount-1),pt=rosePoint(norm(p-to*cfg.trailSpan),d),f=Math.pow(1-to,0.5);ps[i].setAttribute('cx',pt.x.toFixed(2));ps[i].setAttribute('cy',pt.y.toFixed(2));ps[i].setAttribute('r',(0.8+f*2.2).toFixed(2));ps[i].setAttribute('opacity',(0.1+f*0.9).toFixed(3))}pf.style.width=(p*100)+'%';pc.textContent=Math.round(p*100)+'%';requestAnimationFrame(an)}an();
  </script>
</body>
</html>
