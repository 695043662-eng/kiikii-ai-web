# ============================================================
# Kiikii AI - Nginx 配置
# 域名: kiikii.me
# 后端: 127.0.0.1:5000 (Next.js)
# ============================================================

# HTTP 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kiikii.me www.kiikii.me;
    
    # Let's Encrypt 验证路径（申请证书时需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kiikii.me www.kiikii.me;
    
    # ============================================================
    # SSL 证书配置（需要先申请证书）
    # ============================================================
    # 方案1: Let's Encrypt 免费证书
    ssl_certificate /etc/letsencrypt/live/kiikii.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiikii.me/privkey.pem;
    
    # 方案2: 自签名证书（临时测试用）
    # ssl_certificate /etc/nginx/ssl/kiikii.me.crt;
    # ssl_certificate_key /etc/nginx/ssl/kiikii.me.key;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # ============================================================
    # 安全头
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # ============================================================
    # 代理设置
    # ============================================================
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # ============================================================
    # 主业务转发 (Next.js)
    # ============================================================
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_buffering off;
        proxy_cache off;
    }
    
    # ============================================================
    # API 接口转发
    # ============================================================
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        
        # SSE 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        
        # API 超时延长（生图可能需要较长时间）
        proxy_read_timeout 300s;
    }
    
    # ============================================================
    # WebSocket 支持 (用于热更新)
    # ============================================================
    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:5000/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # ============================================================
    # 静态资源缓存
    # ============================================================
    location /_next/static/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_cache static_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_key $uri;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    
    # ============================================================
    # 日志
    # ============================================================
    access_log /var/log/nginx/kiikii.me.access.log;
    error_log /var/log/nginx/kiikii.me.error.log;
}
